name: DB 적용

# main 에 db/migrations/** 가 머지되면 이 앱의 스키마에 자동 적용한다 (scripts/db-migrate.sh, <스키마>_app 접속).
# 절차는 CLAUDE.md 2번. 미리 보기는 Actions 화면에서 mode=dry-run 으로 수동 실행한다.
#
# 이미 테이블이 있는 운영 중인 앱은 처음 한 번 「기준선」을 기록해야 한다 (migration-guide.md §4-1):
#   db/migrations/<번호>_baseline.sql 을 merge → Actions 화면에서 mode=baseline 실행.
#   기준선 파일은 실행하지 않고 「적용됨」으로만 기록한다. 기록 전에는 push 로 돌아도 적용하지 않고 멈춘다.
# (speedrack-co/MS_accesshub · MS_snms 의 db-apply.yml 과 같은 방식)
#
# 준비 (둘 다 있어야 적용된다):
#   1) GitHub 저장소 Settings → Secrets and variables → Actions 에 Secret `DATABASE_URL`.
#      값은 AccessHub 「DB 비밀번호 발급」의 접속 주소 (배포 플랫폼에 넣은 것과 같은 값).
#   2) 아래 jobs.apply.env 의 DB_SCHEMA 에 이 앱의 스키마 이름. 앱마다 고치는 곳은 이 한 줄뿐이다.
#
# ⚠ pull_request 트리거를 넣지 않는다 — 같은 repo 브랜치의 PR 은 secret 을 읽을 수 있다.
# ⚠ 무료 플랜이라 쓰기 권한자가 워크플로를 고친 브랜치로 secret 을 꺼낼 수 있다. 앱 DB 계정(<스키마>_app)은
#   자기 스키마만 바꿀 수 있어 영향 범위는 이 앱으로 한정된다.
#   job 은 main 에서만 돈다. 로그에 접속 주소가 찍히지 않도록 set -x 를 쓰지 않는다.

on:
  push:
    branches: [main]
    # 워크플로 파일 자체가 바뀌어도 돈다 — 처음 머지될 때 밀려 있는 마이그레이션이 바로 적용되게.
    paths: ['db/migrations/**', '.github/workflows/db-apply.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run(미리 보기) · apply(적용) · baseline(기준선 파일을 실행하지 않고 적용됨으로 기록, 처음 한 번)'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply, baseline]

concurrency:
  group: db-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    # 템플릿 repo 자체에는 DB 가 없으므로 돌지 않는다.
    if: github.ref == 'refs/heads/main' && github.repository != 'speedrack-co/repo-template'
    runs-on: ubuntu-latest
    env:
      DB_URL_SECRET: ${{ secrets.DATABASE_URL }}
      # 이 앱의 스키마 이름 — CLAUDE.md 「이 앱에 대해」의 스키마와 같은 값을 적는다 (예: DB_SCHEMA: ms_snms).
      # repo 이름으로 추측하지 않는다. AccessHub 에서 새로 받은 스키마는 보통 repo 이름을 소문자로 바꾼 것이지만,
      # 「이미 운영 중인 앱」으로 기존 스키마를 연결한 앱은 repo 이름과 다르다. 담당자에게 확인한 이름을 적는다.
      DB_SCHEMA: ''
      EVENT: ${{ github.event_name }}
      MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: psql 준비
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

      - name: 적용
        run: |
          set -euo pipefail
          if [ -z "$DB_URL_SECRET" ] || [ -z "$DB_SCHEMA" ]; then
            # 아직 DB 준비를 안 한 repo(마이그레이션 파일이 없음)는 push 로 돌았을 때 실패로 보지 않는다.
            if [ "$EVENT" = push ] && ! compgen -G "db/migrations/*.sql" >/dev/null; then
              echo "::notice::마이그레이션 파일이 없고 DB 준비(Secret DATABASE_URL · DB_SCHEMA)도 안 되어 있습니다. 적용할 것이 없어 넘어갑니다"; exit 0
            fi
            [ -n "$DB_URL_SECRET" ] || echo "::error::저장소 Secret DATABASE_URL 이 없습니다 (Settings → Secrets and variables → Actions)"
            [ -n "$DB_SCHEMA" ] || echo "::error::스키마 이름이 없습니다. .github/workflows/db-apply.yml 의 DB_SCHEMA 에 이 앱의 스키마 이름을 적으세요 (CLAUDE.md 「이 앱에 대해」)"
            exit 1
          fi
          # 주소 모양을 먼저 검사한다. 비밀번호에 @ / ? # 가 그대로 있으면 psql 이 그 뒤를 호스트로 읽고
          # 오류 메시지에 비밀번호 일부를 찍는다. 주소 자체는 출력하지 않는다.
          [[ "$DB_URL_SECRET" =~ ^postgres(ql)?://[^:@/?#]+:[^@/?#]+@[^@/?#:]+(:[0-9]+)?/[^@?#]+(\?[^@#]*)?$ ]] \
            || { echo "::error::Secret DATABASE_URL 모양이 맞지 않습니다. 비밀번호의 특수문자를 바꿔 넣으세요: @ → %40, / → %2F, ? → %3F, # → %23"; exit 1; }
          # 마이그레이션은 Session pooler(5432)로 붙는다. 요청마다 뜨는 서버용 주소(6543)를 넣었어도 여기서 5432 로 바꿔 쓴다.
          url="$DB_URL_SECRET"
          if [[ "$url" =~ ^(.*@[^@/?#:]+):6543(/.*)$ ]]; then url="${BASH_REMATCH[1]}:5432${BASH_REMATCH[2]}"; fi
          export DATABASE_URL="$url"

          echo "스키마: $DB_SCHEMA"

          # 기준선 파일(*_baseline.sql)이 아직 기록되지 않았으면 일반 마이그레이션처럼 실행하면 안 된다
          # (이미 있는 테이블을 다시 만들려다 실패하고, 그 파일이 맨 앞에 남아 이후 변경이 전부 막힌다).
          pending="$(scripts/db-migrate.sh --dry-run)"
          baseline_pending=false
          if printf '%s\n' "$pending" | grep -q '_baseline\.sql$'; then baseline_pending=true; fi

          case "$MODE" in
            dry-run)
              echo "$pending"
              if $baseline_pending; then echo "::warning::기준선 파일이 아직 기록되지 않았습니다. mode=baseline 으로 먼저 실행하세요 (실행하지 않고 적용됨으로만 기록합니다)"; fi
              exit 0 ;;
            baseline)
              shopt -s nullglob
              files=(db/migrations/*_baseline.sql)
              [ ${#files[@]} -eq 1 ] || { echo "::error::기준선 파일은 db/migrations/*_baseline.sql 하나여야 합니다 (지금 ${#files[@]}개)"; exit 1; }
              scripts/db-migrate.sh --baseline "${files[0]}"
              scripts/db-migrate.sh --dry-run
              exit 0 ;;
            apply)
              if $baseline_pending; then
                echo "$pending"
                echo "::error::기준선 파일이 아직 기록되지 않아 적용하지 않았습니다. Actions 화면에서 「DB 적용」을 mode=baseline 으로 실행한 뒤, mode=apply 로 다시 실행하세요 (migration-guide.md §4-1)"
                exit 1
              fi
              scripts/db-migrate.sh ;;
            *) echo "::error::알 수 없는 mode: $MODE"; exit 1 ;;
          esac

          # 적용 뒤 남은 파일이 없는지 확인
          out="$(scripts/db-migrate.sh --dry-run)"
          echo "$out"
          echo "$out" | grep -q '^적용할 파일 없음' || { echo "::error::적용 뒤에도 남은 파일이 있습니다"; exit 1; }
